# Development settings only: anyone on the network can connect.
# Add passwords (password_file) before using this on a shared lab network.
listener 1883
allow_anonymous true
# Broker notices allow the dashboard to spot repeated MQTT client-ID collisions.
log_dest stdout
log_dest topic
log_type error
log_type warning
log_type notice
log_type information
max_packet_size 8192
