# Uses the version-1 structure generated by this installed Codex app.
version = 1
name = "IOT-Edge_Platform"

[setup]
script = ""

[setup.win32]
script = '''
if ($env:CODEX_WORKTREE_PATH) { Set-Location $env:CODEX_WORKTREE_PATH }
& .\tools\workspace.ps1 -Action Setup'''

[cleanup]
script = ""

[cleanup.win32]
script = '''
if ($env:CODEX_WORKTREE_PATH) { Set-Location $env:CODEX_WORKTREE_PATH }
& .\tools\workspace.ps1 -Action Stop'''

[[actions]]
name = "Start platform"
icon = "tool"
command = '& .\tools\workspace.ps1 -Action Start'
platform = "win32"

[[actions]]
name = "Stop platform"
icon = "tool"
command = '& .\tools\workspace.ps1 -Action Stop'
platform = "win32"

[[actions]]
name = "Run tests"
icon = "tool"
command = '& .\tools\workspace.ps1 -Action Test'
platform = "win32"

[[actions]]
name = "Open dashboard"
icon = "tool"
command = '& .\tools\workspace.ps1 -Action Open'
platform = "win32"
